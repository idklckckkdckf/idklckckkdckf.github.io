<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>头版标题小样</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#f6f6f4;color:#191919;font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}
  section{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
    border-bottom:1px solid #ddd;padding:40px 20px;position:relative}
  .opt{position:absolute;top:26px;left:30px;font-family:ui-monospace,monospace;font-size:13px;
    letter-spacing:.3em;color:#8a8781}
  .w-kicker{font-family:ui-monospace,monospace;font-size:12px;letter-spacing:.5em;text-indent:.5em;
    color:#8a8781;margin-bottom:34px}
  .w-title{font-size:clamp(72px,15vw,150px);font-weight:900;line-height:1;color:#191919}
  .w-rule{width:min(420px,72vw);height:1px;margin:38px auto 0;
    background:linear-gradient(90deg,transparent,#191919,transparent)}
  /* A: 印章 */
  .t-seal{display:flex;align-items:center;justify-content:center}
  .t-seal .seal{background:#161616;color:#f6f6f4;display:inline-flex;align-items:center;justify-content:center;
    width:1.28em;height:1.28em;font-size:.86em;margin-left:.18em;font-weight:900}
  /* B: 双线框 */
  .t-frame span{border:4px double #161616;padding:.14em .42em .14em .6em;letter-spacing:.18em}
  /* C: 竖排 */
  .t-vert{writing-mode:vertical-rl;letter-spacing:.22em}
</style></head>
<body>
<section id="a"><div class="opt">A · 印章</div>
  <div class="w-kicker">THE FRONT PAGE</div>
  <div class="w-title t-seal">头<span class="seal">版</span></div>
  <div class="w-rule"></div>
</section>
<section id="b"><div class="opt">B · 框线</div>
  <div class="w-kicker">THE FRONT PAGE</div>
  <div class="w-title t-frame"><span>头版</span></div>
  <div class="w-rule"></div>
</section>
<section id="c"><div class="opt">C · 竖排</div>
  <div class="w-kicker">THE FRONT PAGE</div>
  <div class="w-title t-vert">头版</div>
  <div class="w-rule"></div>
</section>
</body></html>
